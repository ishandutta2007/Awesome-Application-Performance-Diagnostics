<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Accent Gradient for Text -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Graph Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseNode {
      0% { r: 4px; opacity: 0.4; }
      50% { r: 8px; opacity: 1; filter: drop-shadow(0 0 8px #38bdf8); }
      100% { r: 4px; opacity: 0.4; }
    }
    @keyframes dashMove {
      0% { stroke-dashoffset: 1000; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes waveMove {
      0% { transform: translateX(0); }
      50% { transform: translateX(-20px); }
      100% { transform: translateX(0); }
    }
    .grid-line { stroke: #334155; stroke-opacity: 0.25; stroke-width: 1; }
    .pulse-dot-1 { animation: pulseNode 3s infinite ease-in-out; }
    .pulse-dot-2 { animation: pulseNode 3.5s infinite ease-in-out 0.8s; }
    .pulse-dot-3 { animation: pulseNode 2.8s infinite ease-in-out 1.5s; }
    .graph-line {
      stroke: url(#textGradient);
      stroke-width: 3.5;
      fill: none;
      stroke-dasharray: 1000;
      animation: dashMove 12s linear infinite;
      filter: url(#glow);
    }
    .hero-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: url(#textGradient);
    }
    .hero-subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 18px;
      fill: #94a3b8;
    }
    .tag-pill {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 12px;
      font-weight: 600;
      fill: #38bdf8;
    }
  </style>

  <!-- Background Card -->
  <rect width="1200" height="340" rx="16" fill="url(#bgGradient)" stroke="#1e293b" stroke-width="2"/>

  <!-- Background Grid Network -->
  <g class="grid-line">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    
    <line x1="200" y1="0" x2="200" y2="340" />
    <line x1="400" y1="0" x2="400" y2="340" />
    <line x1="600" y1="0" x2="600" y2="340" />
    <line x1="800" y1="0" x2="800" y2="340" />
    <line x1="1000" y1="0" x2="1000" y2="340" />
  </g>

  <!-- Dynamic Telemetry Line Graph in Background (Low opacity so text stays readable) -->
  <g opacity="0.4">
    <path class="graph-line" d="M 50 280 Q 150 220, 250 250 T 450 180 T 650 230 T 850 140 T 1050 190 T 1150 120" />
  </g>

  <!-- Animated Observability Nodes -->
  <circle cx="250" cy="250" class="pulse-dot-1" fill="#38bdf8" />
  <circle cx="450" cy="180" class="pulse-dot-2" fill="#818cf8" />
  <circle cx="850" cy="140" class="pulse-dot-3" fill="#c084fc" />
  <circle cx="1050" cy="190" class="pulse-dot-1" fill="#38bdf8" />

  <!-- Foreground Title and Subtitle -->
  <g transform="translate(60, 130)">
    <!-- Main Title -->
    <text x="0" y="0" class="hero-title">Awesome Application Performance Diagnostics 🔍📊</text>
    
    <!-- Subtitle -->
    <text x="0" y="42" class="hero-subtitle">Curated APM Platforms, Distributed Tracing, Continuous Profiling &amp; AI-Powered Observability</text>
    
    <!-- Category Badges / Pills -->
    <g transform="translate(0, 80)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="130" height="28" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
      <text x="65" y="18" text-anchor="middle" class="tag-pill">⚡ APM &amp; Profiling</text>

      <!-- Pill 2 -->
      <rect x="145" y="0" width="165" height="28" rx="14" fill="#0f172a" stroke="#818cf8" stroke-width="1.5" />
      <text x="227" y="18" text-anchor="middle" class="tag-pill" fill="#818cf8">🕵️ Distributed Tracing</text>

      <!-- Pill 3 -->
      <rect x="325" y="0" width="170" height="28" rx="14" fill="#0f172a" stroke="#c084fc" stroke-width="1.5" />
      <text x="410" y="18" text-anchor="middle" class="tag-pill" fill="#c084fc">🤖 AI-Native Diagnostics</text>
      
      <!-- Pill 4 -->
      <rect x="510" y="0" width="150" height="28" rx="14" fill="#0f172a" stroke="#34d399" stroke-width="1.5" />
      <text x="585" y="18" text-anchor="middle" class="tag-pill" fill="#34d399">🔓 Open-Source Tools</text>
    </g>
  </g>
</svg>
